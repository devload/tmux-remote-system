name: Build macOS Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: '1.0.0'

env:
  JAVA_URL_ARM64: 'https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.17%2B10/OpenJDK17U-jre_aarch64_mac_hotspot_17.0.17_10.tar.gz'
  JAVA_URL_X64: 'https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.17%2B10/OpenJDK17U-jre_x64_mac_hotspot_17.0.17_10.tar.gz'
  NODE_URL_ARM64: 'https://nodejs.org/dist/v20.10.0/node-v20.10.0-darwin-arm64.tar.gz'
  NODE_URL_X64: 'https://nodejs.org/dist/v20.10.0/node-v20.10.0-darwin-x64.tar.gz'

jobs:
  build-x64:
    runs-on: macos-13  # Intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION:-1.0.0}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create directory structure
        run: |
          mkdir -p SessionCast/{bin,lib,java,node,config,logs}

      - name: Download Java 17 (x64)
        run: |
          echo "Downloading Java 17 for x64..."
          curl -fsSL "$JAVA_URL_X64" -o java.tar.gz
          tar -xzf java.tar.gz -C SessionCast/java --strip-components=1
          rm java.tar.gz
          echo "Java version:"
          SessionCast/java/bin/java -version

      - name: Download Node.js 20 (x64)
        run: |
          echo "Downloading Node.js 20 for x64..."
          curl -fsSL "$NODE_URL_X64" -o node.tar.gz
          tar -xzf node.tar.gz -C SessionCast/node --strip-components=1
          rm node.tar.gz
          echo "Node version:"
          SessionCast/node/bin/node -v

      - name: Create launcher scripts
        run: |
          # Java Agent launcher
          cat > SessionCast/bin/sessioncast-agent << 'EOF'
          #!/bin/bash
          SESSIONCAST_HOME="$(cd "$(dirname "$0")/.." && pwd)"
          export SESSIONCAST_HOME
          if [[ -f "$SESSIONCAST_HOME/java/bin/java" ]]; then
              JAVA_HOME="$SESSIONCAST_HOME/java"
              export JAVA_HOME
              JAVA="$JAVA_HOME/bin/java"
          elif [[ -n "$JAVA_HOME" ]]; then
              JAVA="$JAVA_HOME/bin/java"
          else
              JAVA="java"
          fi
          exec "$JAVA" -jar "$SESSIONCAST_HOME/lib/sessioncast-agent.jar" "$@"
          EOF
          chmod +x SessionCast/bin/sessioncast-agent

          # Node Agent launcher
          cat > SessionCast/bin/sessioncast-node << 'EOF'
          #!/bin/bash
          SESSIONCAST_HOME="$(cd "$(dirname "$0")/.." && pwd)"
          export SESSIONCAST_HOME
          if [[ -f "$SESSIONCAST_HOME/node/bin/node" ]]; then
              NODE_HOME="$SESSIONCAST_HOME/node"
              export PATH="$NODE_HOME/bin:$PATH"
          fi
          exec npx sessioncast "$@"
          EOF
          chmod +x SessionCast/bin/sessioncast-node

      - name: Create default config
        run: |
          cat > SessionCast/config/agent-config.yml << 'EOF'
          # SessionCast Agent Configuration
          machineId: MY_MAC
          relay: wss://relay.sessioncast.io/ws
          token: YOUR_TOKEN_HERE
          EOF

      - name: Create portable tarball
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          tar -czvf "SessionCast-macOS-x64-${VERSION}.tar.gz" SessionCast
          ls -la *.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SessionCast-macOS-x64
          path: SessionCast-macOS-x64-*.tar.gz
          retention-days: 30

  build-arm64:
    runs-on: macos-14  # Apple Silicon
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION:-1.0.0}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create directory structure
        run: |
          mkdir -p SessionCast/{bin,lib,java,node,config,logs}

      - name: Download Java 17 (arm64)
        run: |
          echo "Downloading Java 17 for arm64..."
          curl -fsSL "$JAVA_URL_ARM64" -o java.tar.gz
          tar -xzf java.tar.gz -C SessionCast/java --strip-components=1
          rm java.tar.gz
          echo "Java version:"
          SessionCast/java/bin/java -version

      - name: Download Node.js 20 (arm64)
        run: |
          echo "Downloading Node.js 20 for arm64..."
          curl -fsSL "$NODE_URL_ARM64" -o node.tar.gz
          tar -xzf node.tar.gz -C SessionCast/node --strip-components=1
          rm node.tar.gz
          echo "Node version:"
          SessionCast/node/bin/node -v

      - name: Create launcher scripts
        run: |
          # Java Agent launcher
          cat > SessionCast/bin/sessioncast-agent << 'EOF'
          #!/bin/bash
          SESSIONCAST_HOME="$(cd "$(dirname "$0")/.." && pwd)"
          export SESSIONCAST_HOME
          if [[ -f "$SESSIONCAST_HOME/java/bin/java" ]]; then
              JAVA_HOME="$SESSIONCAST_HOME/java"
              export JAVA_HOME
              JAVA="$JAVA_HOME/bin/java"
          elif [[ -n "$JAVA_HOME" ]]; then
              JAVA="$JAVA_HOME/bin/java"
          else
              JAVA="java"
          fi
          exec "$JAVA" -jar "$SESSIONCAST_HOME/lib/sessioncast-agent.jar" "$@"
          EOF
          chmod +x SessionCast/bin/sessioncast-agent

          # Node Agent launcher
          cat > SessionCast/bin/sessioncast-node << 'EOF'
          #!/bin/bash
          SESSIONCAST_HOME="$(cd "$(dirname "$0")/.." && pwd)"
          export SESSIONCAST_HOME
          if [[ -f "$SESSIONCAST_HOME/node/bin/node" ]]; then
              NODE_HOME="$SESSIONCAST_HOME/node"
              export PATH="$NODE_HOME/bin:$PATH"
          fi
          exec npx sessioncast "$@"
          EOF
          chmod +x SessionCast/bin/sessioncast-node

      - name: Create default config
        run: |
          cat > SessionCast/config/agent-config.yml << 'EOF'
          # SessionCast Agent Configuration
          machineId: MY_MAC
          relay: wss://relay.sessioncast.io/ws
          token: YOUR_TOKEN_HERE
          EOF

      - name: Create portable tarball
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          tar -czvf "SessionCast-macOS-arm64-${VERSION}.tar.gz" SessionCast
          ls -la *.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SessionCast-macOS-arm64
          path: SessionCast-macOS-arm64-*.tar.gz
          retention-days: 30

  release:
    needs: [build-x64, build-arm64]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
